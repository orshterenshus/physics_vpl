services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "127.0.0.1:27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Uncomment to use an NVIDIA GPU (requires the NVIDIA Container Toolkit on the host).
    # Without this, Ollama runs on CPU, which works everywhere but is much slower —
    # this is why OLLAMA_MODEL below defaults to a small model.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # One-shot job: pulls the chosen model into the shared `ollama_data` volume, then exits.
  # Re-run automatically whenever OLLAMA_MODEL changes (`docker compose up -d` again).
  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=ollama:11434
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-qwen2.5:3b}"]
    restart: "no"

  # One-shot job: inserts the example problems (safe to re-run — it clears
  # those chapters first, so it never creates duplicates).
  seed:
    build:
      context: .
      target: builder
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      - MONGODB_URI=mongodb://mongo:27017/physics-lab
    command: ["node", "scripts/seed.mjs"]
    restart: "no"

  app:
    build: .
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
    ports:
      - "3000:3000"
    environment:
      - MONGODB_URI=mongodb://mongo:27017/physics-lab
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:3b}
      - AUTH_SECRET=${AUTH_SECRET:?Set AUTH_SECRET in .env — see .env.example}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - AUTH_TRUST_HOST=true
      - PYTHON_CMD=python3
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30

  # One-shot job: creates the first admin account automatically and prints its
  # one-time login code to this service's logs (`docker compose logs bootstrap-admin`).
  # Safe to re-run — if an admin already exists, it just logs that and exits.
  bootstrap-admin:
    build:
      context: .
      target: builder
    depends_on:
      app:
        condition: service_healthy
    environment:
      - APP_URL=http://app:3000
      - ADMIN_NAME=${ADMIN_NAME:-Admin}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@example.com}
    command: ["node", "scripts/docker-bootstrap-admin.mjs"]
    restart: "no"

volumes:
  mongo_data:
  ollama_data:
